[package]
name = "narjar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A filesystem-backed Nix binary cache"
repository = "https://github.com/mjc/narjar"
license = "MIT OR Apache-2.0"
keywords = ["nix", "cache", "nar", "archive"]
categories = ["command-line-utilities", "network-programming", "parser-implementations"]
include = [
    "/Cargo.lock",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "docs/operations.md",
    "benches/micro.rs",
    "benches/nar_codec.rs",
    "benches/nar_codec_allocations.rs",
    "benches/support/**",
    "tests/support/**",
    "tests/nar_allocations.rs",
    "tests/nar_benchmark_options.rs",
    "src/**",
    "tests/cli.rs",
    "tests/fixtures/nix-2.31.5-http-v0.1.tsv",
    "tests/gc_scale.rs",
    "tests/nar_decoder.rs",
    "tests/nar_encoder.rs",
    "tests/operations_examples.rs",
]

[workspace]
members = ["scripts/nar-corpus", "scripts/nar-chunking"]
exclude = ["fuzz"]
default-members = ["."]

[features]
default = ["application"]
application = [
    "dep:clap", "dep:crossbeam-channel", "dep:digest-io", "dep:ed25519-dalek",
    "dep:enum-map", "dep:fluent-uri", "dep:lzma-rust2", "dep:xz4rust",
    "dep:memchr", "dep:mincdc", "dep:httparse", "dep:postcard", "dep:rustix",
    "dep:sqlite", "dep:signal-hook", "dep:serde_json", "dep:subtle",
    "dep:tempfile", "dep:structured-zstd", "dep:ureq",
]

[[bin]]
name = "narjar"
path = "src/main.rs"
required-features = ["application"]

[[test]]
name = "cli"
required-features = ["application"]

[[test]]
name = "gc_scale"
required-features = ["application"]

[[test]]
name = "nar_benchmark_options"
required-features = ["application"]

[dependencies]
clap = { optional = true, version = "=4.6.7", default-features = false, features = ["cargo", "derive", "env", "error-context", "help", "std", "usage"] }
crossbeam-channel = { optional = true, version = "=0.5.17", default-features = false, features = ["std"] }
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
digest-io = { optional = true, version = "=0.1.0", default-features = false }
ed25519-dalek = { optional = true, version = "=3.0.0", default-features = false, features = ["signature"] }
enum-map = { optional = true, version = "=3.1.0", default-features = false, features = ["derive"] }
fluent-uri = { optional = true, version = "=0.4.1", default-features = false, features = ["std"] }
lzma-rust2 = { optional = true, version = "=0.21.0", default-features = false, features = ["std", "xz", "encoder", "optimization"] }
xz4rust = { optional = true, version = "=0.2.3", default-features = false, features = ["std", "bcj", "crc64", "sha256", "delta", "no_unsafe"] }
memchr = { optional = true, version = "=2.8.3", default-features = false, features = ["std"] }
mincdc = { version = "=0.1.0", optional = true }
httparse = { optional = true, version = "=1.10.1", default-features = false, features = ["std"] }
postcard = { optional = true, version = "=1.1.3", default-features = false, features = ["alloc"] }
rustix = { optional = true, version = "=1.1.5", default-features = false, features = ["event", "fs", "param", "process", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
sqlite = { optional = true, version = "=0.37.3", default-features = false, features = ["linkage"] }
signal-hook = { optional = true, version = "=0.4.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", optional = true }
subtle = { optional = true, version = "=2.6.1", default-features = false }
thiserror = "=2.0.21"
tempfile = { optional = true, version = "=3.27.0", default-features = false }
structured-zstd = { optional = true, version = "=0.0.57", default-features = false, features = ["hash", "std", "kernel-sse", "kernel-bmi2", "kernel-avx2", "kernel-neon", "kernel-sve"] }
ureq = { optional = true, version = "=3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# rustix has no Apple mkfifo API; keep FIFO-rejection tests on Darwin.
libc = { version = "=0.2.189", default-features = false }

[[bench]]
name = "micro"
harness = false
required-features = ["application"]

[[bench]]
name = "nar_codec"
harness = false
required-features = ["application"]

[[bench]]
name = "nar_codec_allocations"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
strip = false
