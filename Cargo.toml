[package]
name = "narjar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A filesystem-backed Nix binary cache"
repository = "https://github.com/mjc/narjar"
license = "MIT OR Apache-2.0"
include = [
    "/Cargo.lock",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "benches/micro.rs",
    "src/**",
    "tests/cli.rs",
    "tests/fixtures/nix-2.31.5-http-v0.1.tsv",
    "tests/gc_scale.rs",
    "tests/nar_decoder.rs",
    "tests/nar_encoder.rs",
]

[workspace]
members = ["scripts/nar-corpus", "scripts/nar-chunking"]
exclude = ["fuzz"]
default-members = ["."]

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["cargo", "derive", "env", "error-context", "help", "std", "usage"] }
crossbeam-channel = { version = "=0.5.17", default-features = false, features = ["std"] }
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature"] }
fluent-uri = { version = "=0.4.1", default-features = false, features = ["std"] }
libc = { version = "=0.2.189", default-features = false }
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "xz", "encoder", "optimization"] }
xz4rust = { version = "=0.2.3", default-features = false, features = ["std", "bcj", "crc64", "sha256", "delta", "no_unsafe"] }
memchr = { version = "=2.8.3", default-features = false, features = ["std"] }
mincdc = "=0.1.0"
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
sqlite = { version = "=0.37.3", default-features = false, features = ["linkage"] }
signal-hook = { version = "=0.4.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = { version = "=2.6.1", default-features = false }
tempfile = { version = "=3.27.0", default-features = false }
structured-zstd = { version = "=0.0.57", default-features = false, features = ["hash", "std", "kernel-sse", "kernel-bmi2", "kernel-avx2", "kernel-neon", "kernel-sve"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[[bench]]
name = "micro"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
strip = false
