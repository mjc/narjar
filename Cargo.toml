[package]
name = "narjar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = ["derive", "env", "std"] }
crossbeam-channel = { version = "=0.5.16", default-features = false, features = ["std"] }
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature"] }
libc = { version = "=0.2.189", default-features = false }
lzma-rust2 = { version = "=0.20.1", default-features = false, features = ["std", "xz", "encoder", "optimization"] }
sha2 = { version = "=0.11.0", default-features = false }
signal-hook = { version = "=0.4.4", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
tempfile = { version = "=3.27.0", default-features = false }
tiny_http = { version = "=0.12.0", default-features = false }

[profile.profiling]
inherits = "release"
debug = 2
strip = false
