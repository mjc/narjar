name: Cargo installation

on:
  workflow_call:
    inputs:
      ref:
        description: Commit supplying the package and installation checks
        required: true
        type: string
      version:
        description: Exact crates.io version; empty installs the packaged source
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    name: Cargo install without Nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev
      - name: Install native macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sqlite
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install and run without Nix
        env:
          CARGO_INSTALL_VERSION: ${{ inputs.version }}
        run: bash ci/check-cargo-install-without-nix.sh

  windows-library:
    name: Windows library (not the Unix CLI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Test the portable library without application dependencies
        run: cargo test --locked --no-default-features --lib --test nar_decoder --test nar_encoder

  windows-application:
    name: Windows application
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install the pinned Rust toolchain
        run: |
          $toolchainFile = Get-Content rust-toolchain.toml -Raw
          if ($toolchainFile -notmatch '(?m)^channel\s*=\s*"([^"]+)"') {
            throw 'Missing Rust toolchain channel'
          }
          $toolchain = $Matches[1]
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Probe NTFS synchronization under a standard account
        run: ./ci/check-windows-filesystem.ps1
      - name: Check the default-feature application
        run: cargo check --locked --bin narjar
