name: Cargo installation

on:
  workflow_call:
    inputs:
      ref:
        description: Commit supplying the package and installation checks
        required: true
        type: string
      version:
        description: Exact crates.io version; empty installs the packaged source
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    name: Cargo install without Nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libsqlite3-dev
      - name: Install native macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sqlite
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install and run without Nix
        env:
          CARGO_INSTALL_VERSION: ${{ inputs.version }}
        run: bash ci/check-cargo-install-without-nix.sh

  windows-application:
    name: Windows application
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install the pinned Rust toolchain
        id: windows-toolchain
        run: |
          $toolchainFile = Get-Content rust-toolchain.toml -Raw
          if ($toolchainFile -notmatch '(?m)^channel\s*=\s*"([^"]+)"') {
            throw 'Missing Rust toolchain channel'
          }
          $toolchain = $Matches[1]
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install the pinned native test runner
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-nextest-0.9.136.zip'
          Invoke-WebRequest -Uri 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'fb865364e50c15e7be084f84f18e15dde96c6b0d8022cc7d6445f2a3761cda6e') {
            throw 'Unexpected nextest archive digest'
          }
          $cargoBin = Join-Path $env:USERPROFILE '.cargo/bin'
          Expand-Archive -Path $archive -DestinationPath $cargoBin -Force
          cargo nextest --version
      - name: Test the portable library without application dependencies
        run: cargo nextest run --config-file ci/nextest.toml --profile windows --locked --no-default-features --lib --test nar_decoder --test nar_encoder --test nar_allocations
      - name: Build the default-feature application
        if: ${{ !cancelled() && steps.windows-toolchain.outcome == 'success' }}
        run: cargo build --locked --bin narjar
      - name: Build and locate the native application test harness
        if: ${{ !cancelled() && steps.windows-toolchain.outcome == 'success' }}
        run: |
          $suite = cargo nextest list --locked --all-features --test cli --message-format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Application test build failed' }
          $binary = $suite.'rust-suites'.'narjar::cli'.'binary-path'
          if (-not $binary -or -not (Test-Path $binary -PathType Leaf)) {
            throw 'Missing application test executable'
          }
          "NARJAR_APPLICATION_TEST_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check NTFS and the application under a standard account
        run: ./ci/check-windows-filesystem.ps1 -NarjarExecutable (Resolve-Path target/debug/narjar.exe) -ApplicationTests $env:NARJAR_APPLICATION_TEST_BINARY
      - name: Run the native application suite
        if: ${{ !cancelled() && steps.windows-toolchain.outcome == 'success' }}
        run: cargo nextest run --config-file ci/nextest.toml --profile windows --locked --package narjar --all-features --no-fail-fast
      - name: Install the Cargo package and run it without developer tools
        env:
          CARGO_INSTALL_VERSION: ${{ inputs.version }}
        run: ./ci/check-cargo-install-without-nix.ps1 -Version $env:CARGO_INSTALL_VERSION
