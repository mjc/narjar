name: flake

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check dependency advisories
        run: nix run -L --no-update-lock-file .#advisory-check
      - name: Check the flake contract
        run: ./ci/check-flake-contract.sh
      - run: nix build -L --no-update-lock-file .#packages.x86_64-linux.default
      - run: |
          data_dir="$(mktemp -d)"
          nix run -L --no-update-lock-file .#default -- init --data-dir "$data_dir"
          test -f "$data_dir/nix-cache-info"
          test -d "$data_dir/nar"
      - run: nix build -L --no-update-lock-file .#packages.x86_64-linux.narjar-static
      - run: nix build -L --no-update-lock-file .#checks.x86_64-linux.static-elf
      - name: Real Nix end-to-end gate (flat)
        run: nix run -L --no-update-lock-file .#nix-e2e -- --storage-backend flat
      - name: Real Nix end-to-end gate (chunked)
        run: nix run -L --no-update-lock-file .#nix-e2e -- --storage-backend chunked
      - run: nix run -L --no-update-lock-file .#provenance

  darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build the Darwin package
        run: nix build -L --no-update-lock-file .#packages.aarch64-darwin.default
      - name: Run the Darwin Narjar package tests
        run: nix build -L --no-update-lock-file .#checks.aarch64-darwin.tests
