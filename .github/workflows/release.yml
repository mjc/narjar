name: release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed stable tag, such as v0.1.0
        required: true
        type: string
      notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      tag_object: ${{ steps.candidate.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Verify approval configuration and signed candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash ci/check-release-candidate.sh "$RELEASE_TAG"

  checks:
    needs: candidate
    uses: ./.github/workflows/flake.yml
    with:
      ref: ${{ needs.candidate.outputs.commit }}

  prepare:
    needs: candidate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Install devenv from the locked package set
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)#devenv"
      - name: Package the crate and static Linux binary
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_NOTES//[[:space:]]/}"
          devenv shell -- cargo package --locked --package narjar
          static_package=$(nix build -L --no-update-lock-file --no-link --print-out-paths .#packages.x86_64-linux.narjar-static)
          nix build -L --no-update-lock-file --no-link .#checks.x86_64-linux.static-elf
          bundle="target/release/narjar-v$RELEASE_VERSION-x86_64-linux"
          install -Dm755 "$static_package/bin/narjar" "$bundle/narjar"
          test "$("$bundle/narjar" --version)" = "narjar $RELEASE_VERSION"
          cp LICENSE-APACHE LICENSE-MIT "$bundle/"
          timestamp=$(git show -s --format=%ct "$RELEASE_COMMIT")
          tar --sort=name --mtime="@$timestamp" --owner=0 --group=0 --numeric-owner \
            -C target/release -czf "$bundle.tar.gz" "narjar-v$RELEASE_VERSION-x86_64-linux"
          cp "target/package/narjar-$RELEASE_VERSION.crate" target/release/
          printf '%s\n' "$RELEASE_NOTES" > target/release/release-notes.md
          cd target/release
          sha256sum ./*.crate ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            target/release/*.crate
            target/release/*.tar.gz
            target/release/SHA256SUMS
            target/release/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [candidate, checks, prepare]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
      EXPECTED_RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
      EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.candidate.outputs.tag_object }}
      BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_RELEASE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Recheck the candidate after approval
        run: bash ci/check-release-candidate.sh "$RELEASE_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: target/release
      - name: Verify staged artifacts and detect an already-published crate
        id: registry
        run: |
          set -euo pipefail
          (cd target/release && sha256sum --check SHA256SUMS)
          bash ci/check-published-crate.sh
      - name: Install devenv from the locked package set
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)#devenv"
      - name: Check the exact Cargo archive before publishing
        if: steps.registry.outputs.published == 'false'
        run: |
          set -euo pipefail
          devenv shell -- cargo package --locked --package narjar
          cmp "target/package/narjar-$RELEASE_VERSION.crate" "target/release/narjar-$RELEASE_VERSION.crate"
      - name: Authenticate with Trusted Publishing
        if: steps.registry.outputs.published == 'false' && env.BOOTSTRAP_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@9c067fc5d5c254b33978fed918cb50c032549d0e
      - name: Publish only the narjar package
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN || steps.auth.outputs.token }}
        run: devenv shell -- cargo publish --locked --package narjar --registry crates-io
      - name: Verify registry bytes and installation
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            --user-agent 'narjar-release (https://github.com/mjc/narjar)' \
            "https://static.crates.io/crates/narjar/narjar-$RELEASE_VERSION.crate" \
            --output target/registry.crate
          cmp target/registry.crate "target/release/narjar-$RELEASE_VERSION.crate"
          devenv shell -- cargo install --locked --registry crates-io --version "=$RELEASE_VERSION" \
            --root "$PWD/target/registry-install" narjar
          test "$(target/registry-install/bin/narjar --version)" = "narjar $RELEASE_VERSION"
      - name: Publish the GitHub release
        run: bash ci/publish-github-release.sh

  install-published:
    needs: [candidate, publish]
    uses: ./.github/workflows/cargo-install.yml
    with:
      ref: ${{ needs.candidate.outputs.commit }}
      version: ${{ needs.candidate.outputs.version }}
