worker_processes 1;
pid /tmp/narjar-nix-http-trace/nginx.pid;
error_log /tmp/narjar-nix-http-trace/error.log notice;

events {
  worker_connections 128;
}

http {
  log_format trace escape=json
    '$msec\t$request_method\t$request_uri\t$status\t'
    '$request_length\t$body_bytes_sent\t$content_length\t'
    '$http_transfer_encoding\t$http_expect\t$http_content_type\t'
    '$http_user_agent\t$remote_user\t$http_range\t'
    '$sent_http_content_range\t$http_if_none_match\t'
    '$http_accept\t$http_accept_encoding';

  access_log /tmp/narjar-nix-http-trace/access-v2.log trace buffer=32k flush=1s;
  client_body_temp_path /tmp/narjar-nix-http-trace/body;
  client_max_body_size 0;

  server {
    listen 127.0.0.1:18080;
    root /tmp/narjar-nix-http-trace/root;
    create_full_put_path on;
    dav_methods PUT;

    location ~ ^/redirect/(.*)$ {
      return 307 /redirect-target/$1$is_args$args;
    }

    location /auth/ {
      auth_basic "narjar trace";
      auth_basic_user_file /tmp/narjar-nix-http-trace/htpasswd;
    }
  }
}
