[package]
name = "narjar-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
narjar = { path = "..", default-features = false }
tempfile = "3.27.0"
# The unpublished harness compiles the binary's cache modules directly.
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
digest-io = { version = "=0.1.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature"] }
enum-map = { version = "=3.1.0", default-features = false, features = ["derive"] }
fluent-uri = { version = "=0.4.1", default-features = false, features = ["std"] }
getrandom = { version = "=0.2.17", default-features = false, features = ["std"] }
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "xz", "encoder", "optimization"] }
xz4rust = { version = "=0.2.3", default-features = false, features = ["std", "bcj", "crc64", "sha256", "delta", "no_unsafe"] }
memchr = { version = "=2.8.3", default-features = false, features = ["std"] }
mincdc = "=0.1.0"
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rustix = { version = "=1.1.5", default-features = false, features = ["event", "fs", "net", "param", "process", "std"] }
scopeguard = { version = "=1.2.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = { version = "=2.6.1", default-features = false }
thiserror = "=2.0.21"
structured-zstd = { version = "=0.0.57", default-features = false, features = ["hash", "std", "kernel-sse", "kernel-bmi2", "kernel-avx2", "kernel-neon", "kernel-sve"] }

[lib]
path = "harness.rs"

[[bin]]
name = "nar_decode"
path = "fuzz_targets/nar_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nar_encode"
path = "fuzz_targets/nar_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_request"
path = "fuzz_targets/auth_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "narinfo"
path = "fuzz_targets/narinfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xz_upload"
path = "fuzz_targets/xz_upload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zstd_upload"
path = "fuzz_targets/zstd_upload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_info"
path = "fuzz_targets/cache_info.rs"
test = false
doc = false
bench = false
