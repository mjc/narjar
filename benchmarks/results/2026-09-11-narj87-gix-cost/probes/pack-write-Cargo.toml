[package]
name = "narj87-gix-pack-write"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
gix-features = "=0.49.1"
gix-hash = { version = "=0.26.2", features = ["sha1", "sha256"] }
gix-object = { version = "=0.64.1", features = ["sha1", "sha256"] }
gix-odb = { version = "=0.84.0", features = ["sha1", "sha256"] }
gix-pack = { version = "=0.74.2", features = ["sha1", "sha256"] }
tempfile = "=3.27.0"
